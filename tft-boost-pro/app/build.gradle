plugins {
    id 'com.android.application'
}

android {
    namespace 'vn.cuong.tftboost.pro'
    compileSdk 35

    defaultConfig {
        // Goi rieng de cai song song voi TFT Boost (ban khong can Shizuku)
        applicationId 'vn.cuong.tftboost.pro'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '3.0'
    }

    signingConfigs {
        fixed {
            storeFile file('tftboost.keystore')
            storePassword 'tftboost'
            keyAlias 'tftboost'
            keyPassword 'tftboost'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fixed
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
