name: Build TFT Boost APK

on:
  push:
    paths:
      - 'tft-boost/**'
      - 'tft-boost-pro/**'
      - '.github/workflows/tft-boost.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build TFT Boost (khong can Shizuku)
        working-directory: tft-boost
        run: |
          gradle --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/TFT-Boost.apk"

      - name: Build TFT Boost Pro (Shizuku)
        working-directory: tft-boost-pro
        run: |
          gradle --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/TFT-Boost-Pro.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: TFT-Boost-apk
          path: |
            TFT-Boost.apk
            TFT-Boost-Pro.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tft-boost-v${{ github.run_number }}
          name: TFT Boost 2.1 + Pro 3.0 (build ${{ github.run_number }})
          body: |
            - TFT-Boost-Pro.apk: bản dùng Shizuku – khóa 60 FPS, tối ưu tối đa, tự khôi phục khi thoát game.
            - TFT-Boost.apk: bản không cần Shizuku (dùng Trợ năng).
          files: |
            TFT-Boost.apk
            TFT-Boost-Pro.apk
