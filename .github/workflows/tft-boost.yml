name: Build TFT Boost APK

on:
  push:
    paths:
      - 'tft-boost/**'
      - '.github/workflows/tft-boost.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tft-boost
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/TFT-Boost.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: TFT-Boost-apk
          path: TFT-Boost.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tft-boost-v${{ github.run_number }}
          name: TFT Boost (build ${{ github.run_number }})
          body: Tải file TFT-Boost.apk bên dưới về điện thoại rồi cài đặt.
          files: TFT-Boost.apk
